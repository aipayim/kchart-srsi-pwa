<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <title>K线多周期 SRSI 分析</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html,body{height:auto!important;min-height:100vh;overflow:auto!important;display:block!important;overscroll-behavior:y contain;padding-bottom:env(safe-area-inset-bottom)}
    /* 纪律分析面板已统一单列(共享 styles.css)，这里仅保留窄屏细节 */
    .disc-nowprice,.disc-action{flex-wrap:wrap}
    .pwa-install{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(90deg,#0e1626,#10202e);border-top:1px solid var(--border);box-shadow:0 -4px 18px rgba(0,0,0,.45);font-size:12px;color:var(--text)}
    .pwa-install[hidden]{display:none}
    .pwa-install .pi-txt{flex:1;line-height:1.35}
    .pwa-install .pi-txt b{color:var(--accent)}
    .pwa-install button.pi-btn{background:var(--accent);border:none;color:#06121f;font-weight:700;font-size:12px;padding:7px 14px;border-radius:6px;cursor:pointer;font-family:inherit;white-space:nowrap}
    .pwa-install button.pi-btn:hover{filter:brightness(1.1)}
    .pwa-install .pi-close{margin-left:2px;background:transparent;border:none;color:var(--text2);font-size:20px;cursor:pointer;line-height:1;padding:0 4px}
    @media (max-width:480px){.pwa-install{font-size:11px}.pwa-install button.pi-btn{padding:6px 10px}}
    /* 本地交易对列表 chip */
    .pwa-symlist{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px;align-items:center}
    .pwa-sym-chip{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;font-size:11px;line-height:1}
    .pwa-sym-chip.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
    .pwa-sym-name{background:transparent;border:none;color:var(--text);font-family:inherit;font-size:11px;padding:5px 8px;cursor:pointer;font-weight:600}
    .pwa-sym-chip.active .pwa-sym-name{color:var(--accent)}
    .pwa-sym-del{background:transparent;border:none;border-left:1px solid var(--border);color:var(--text2);font-size:13px;line-height:1;padding:4px 7px;cursor:pointer}
    .pwa-sym-del:hover{background:rgba(255,80,80,.15);color:#ff6363}
    /* 数据源不可达提示条 */
    .pwa-srcerr{position:fixed;left:0;right:0;top:0;z-index:60;display:flex;align-items:flex-start;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-top));background:linear-gradient(180deg,#3a0d0d,#2a0a0a);border-bottom:1px solid #ff525266;box-shadow:0 4px 18px rgba(0,0,0,.5);font-size:12px;color:#ff9a9a;line-height:1.4}
    .pwa-srcerr[hidden]{display:none}
    .pwa-srcerr .pi-txt{flex:1}
    .pwa-srcerr b{color:#ffd0d0}
    .pwa-srcerr button.pi-btn{background:#ff5252;border:none;color:#1a0606;font-weight:700;font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit;white-space:nowrap}
    .pwa-srcerr button.pi-close{margin-left:2px;background:transparent;border:none;color:#ff9a9a;font-size:20px;cursor:pointer;line-height:1;padding:0 4px}
  </style>
</head>
<body>
  <div id="pwaSrcErr" class="pwa-srcerr" hidden>
    <div class="pi-txt" id="pwaSrcErrTxt"></div>
    <button id="pwaSrcErrBtn" class="pi-btn">重试</button>
    <button id="pwaSrcErrClose" class="pi-close" aria-label="关闭">×</button>
  </div>
  <div class="kchart-header">
    <span class="kchart-lbl">币对:</span>
    <input id="symInput" type="text" value="BTCUSDT" placeholder="如 BTCUSDT"
           style="background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:5px;font-family:inherit;font-size:11px;width:120px;text-transform:uppercase">
    <button id="symBtn"
            style="background:var(--accent);border:none;color:#06121f;font-size:11px;padding:4px 12px;border-radius:5px;cursor:pointer;font-family:inherit">载入</button>
    <button id="pwaRefreshBtn"
            style="background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:11px;padding:4px 12px;border-radius:5px;cursor:pointer;font-family:inherit">刷新</button>
    <button id="pwaZoomOut"
            style="background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:700;padding:2px 10px;border-radius:5px;cursor:pointer;font-family:inherit">－</button>
    <button id="pwaZoomIn"
            style="background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:700;padding:2px 10px;border-radius:5px;cursor:pointer;font-family:inherit">＋</button>
    <span id="pwaZoomLbl"
          style="background:var(--card);border:1px solid var(--border);color:var(--text2);font-size:11px;padding:4px 8px;border-radius:5px;cursor:pointer;font-family:inherit;min-width:46px;text-align:center"
          title="点击复位 100%">100%</span>
    <span class="kchart-fresh" id="kchartFresh"></span>
    <div id="symList" class="pwa-symlist"></div>
    <div class="kchart-tfbox" style="margin-left:auto">
      <span class="kchart-lbl">周期:</span>
      <span class="kchart-presets">
        <button class="kchart-preset" data-preset="scalp" onclick="window.setKPreset('scalp')">短线</button>
        <button class="kchart-preset" data-preset="day" onclick="window.setKPreset('day')">日内</button>
        <button class="kchart-preset" data-preset="swing" onclick="window.setKPreset('swing')">波段</button>
        <button class="kchart-preset" data-preset="all" onclick="window.setKPreset('all')">全选</button>
      </span>
      <span class="kchart-tfs" id="kchartTFRow"></span>
    </div>
  </div>
  <div class="kchart-tfbox">
    <span class="kchart-lbl">根线数:</span>
    <input type="range" id="kchartBars" min="60" max="300" step="10" oninput="window.setKBars(this.value)">
    <span id="kchartBarsLbl" class="kchart-lbl"></span>
  </div>
  <div class="kchart-tfbox">
    <span class="kchart-lbl">子图:</span>
    <span id="kchartSubToggles" class="kchart-subtog"></span>
  </div>
  <div class="kchart-tfbox kchart-srsibox">
    <span class="kchart-lbl">SRSI:</span>
    <span id="kchartSrsi"></span>
  </div>
  <div class="kchart-hint" id="kchartHint">点击 TF 圆点=设为主图 · 方框=切换SRSI子图 · 速览表/纪律面板可折叠 · 拖拽子图标题栏调整顺序</div>
  <div class="kchart-ovwrap" id="kchartOverviewWrap">
    <div class="kchart-ovhead" onclick="window.kToggleOverview()">多周期 SRSI 速览 <span class="kchart-ovarrow" id="kchartOvArrow">▾</span></div>
    <div id="kchartOverview" class="kchart-overview"></div>
  </div>
  <div class="kchart-discwrap" id="kchartDiscWrap">
    <div class="kchart-ovhead" onclick="window.kToggleDisc()">📋 交易纪律分析 <span class="kchart-ovarrow">▾</span></div>
    <div id="kchartDisc" class="kchart-disc"></div>
  </div>
  <div class="kchart-tradebar" id="kchartTradeBar"></div>
  <div class="kchart-box">
    <canvas id="kchartCanvas"></canvas>
  </div>
  <div class="kchart-settings closed" id="pwaSettings">
    <div class="kchart-ovhead" onclick="document.getElementById('pwaSettings').classList.toggle('closed')">⚙ 模拟真实交易设置（本地持久化）<span class="kchart-ovarrow">▾</span></div>
    <div id="pwaSettingsBody" class="kchart-settings-body">
      <div class="setting-row"><label>快捷交易</label><select id="pwaTradeOn" onchange="pwaTradeOn(this.value)"><option value="1" selected>开启</option><option value="0">关闭</option></select></div>
      <div class="setting-row"><label>本机TSEV自学习</label><select id="pwaLocalLoop" onchange="window.setKLocalLoop && window.setKLocalLoop(this.value==='1')"><option value="1" selected>开启(累积本机样本)</option><option value="0">关闭</option></select></div>
      <div class="setting-row"><label>现货 USDT 池</label><input id="pwaSimSpot" type="number" min="0" step="any" value="5000" onchange="pwaSimChange()"></div>
      <div class="setting-row"><label>永续U本位 USDT 池</label><input id="pwaSimPerp" type="number" min="0" step="any" value="5000" onchange="pwaSimChange()"></div>
      <div style="font-size:9px;color:var(--text2);margin:4px 0 2px">各币本位库存（现货与永续同量，仅填一次）</div>
      <div id="pwaSimCoins" class="sim-coin-list"></div>
      <div class="setting-row" style="margin-top:6px"><button onclick="pwaSimReset()">重置为默认并重建账户</button></div>
    </div>
  </div>
  <div id="pwaInstall" class="pwa-install" hidden>
    <div class="pi-txt" id="pwaInstallTxt"></div>
    <button id="pwaInstallBtn" class="pi-btn">安装到本机</button>
    <button id="pwaInstallClose" class="pi-close" aria-label="关闭">×</button>
  </div>
  <script type="module" src="/src/pwa/kchartApp.js"></script>
</body>
</html>
